services:
  # Service Applicatif Laravel (PHP 8.3 FPM)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tsena_kely_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - /var/www/vendor
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/database/database.sqlite
      SESSION_DRIVER: database
      CACHE_STORE: database
    networks:
      - tsena_network

  # Serveur Web Nginx Reverse Proxy
  web:
    image: nginx:alpine
    container_name: tsena_kely_web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - tsena_network

  # Observabilite & Scraping Prometheus (Optionnel mais pret a l'emploi)
  prometheus:
    image: prom/prometheus:latest
    container_name: tsena_kely_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - web
    networks:
      - tsena_network

networks:
  tsena_network:
    driver: bridge
